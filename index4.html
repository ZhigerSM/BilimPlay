
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BilimPlay — Құпия сандық</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #172554, #312e81);
    color: white;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 34px;
}

.subtitle {
    text-align: center;
    color: #c7d2fe;
    margin-bottom: 30px;
}

.panel {
    background: white;
    color: #1e293b;
    padding: 25px;
    border-radius: 18px;
    max-width: 650px;
    margin: 20px auto;
}

label {
    display: block;
    font-weight: bold;
    margin: 15px 0 8px;
}

select, textarea {
    width: 100%;
    padding: 12px;
    border: 2px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
}

textarea {
    min-height: 70px;
    resize: vertical;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 13px 22px;
    font-size: 16px;
    font-weight: bold;
}

.primary {
    background: #4f46e5;
    color: white;
    width: 100%;
    margin-top: 20px;
}

.primary:hover {
    background: #3730a3;
}

.secondary {
    background: #e0e7ff;
    color: #3730a3;
    margin-top: 15px;
}

.answer-button {
    background: #16a34a;
    color: white;
    margin-top: 18px;
}

#tasks {
    margin-top: 20px;
}

.game-info {
    text-align: center;
    font-size: 18px;
    margin: 20px 0;
}

.chests {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.chest {
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 16px;
    padding: 12px;
    color: white;
    box-shadow: none;
    transition: transform 0.2s;
}

.chest:hover:not(:disabled) {
    transform: translateY(-6px);
    background: rgba(255,255,255,0.22);
}

.chest img {
    display: block;
    width: 100%;
    height: 105px;
    object-fit: contain;
}

.chest span {
    display: block;
    margin-top: 8px;
    font-size: 16px;
}

.chest:disabled {
    opacity: 0.45;
    cursor: default;
}

.task-card {
    background: white;
    color: #1e293b;
    padding: 25px;
    border-radius: 18px;
    text-align: center;
    margin: 30px auto;
    max-width: 650px;
    animation: appear 0.4s ease;
}

.task-card h2 {
    color: #4f46e5;
}

.task-text {
    font-size: 23px;
    line-height: 1.5;
    font-weight: bold;
    white-space: pre-wrap;
}

.answer-text {
    background: #dcfce7;
    color: #166534;
    padding: 18px;
    border-radius: 12px;
    margin-top: 18px;
    font-size: 21px;
    font-weight: bold;
    white-space: pre-wrap;
}

.hidden {
    display: none;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.8);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-width: 500px) {
    h1 {
        font-size: 26px;
    }

    .chest img {
        height: 85px;
    }
}
</style>
</head>

<body>
<div class="container">

    <h1>🔐 Құпия сандық</h1>
    <p class="subtitle">Сандықты таңда — тапсырманы орында!</p>

    <section id="setup" class="panel">
        <h2>⚙️ Ойын баптаулары</h2>

        <label for="chestCount">Сандық саны:</label>
        <select id="chestCount">
            <option value="3">3 сандық</option>
            <option value="4">4 сандық</option>
            <option value="5">5 сандық</option>
            <option value="6" selected>6 сандық</option>
            <option value="9">9 сандық</option>
            <option value="12">12 сандық</option>
        </select>

        <div id="tasks"></div>

        <button class="primary" onclick="startGame()">
            🚀 Ойынды бастау
        </button>
    </section>

    <section id="game" class="hidden">

        <div class="game-info">
            <p>Ашылған сандықтар:
                <strong id="openedCount">0</strong> /
                <strong id="totalCount">6</strong>
            </p>
            <p>Бір сандықты таңдаңыз!</p>
        </div>

        <div class="chests" id="chestArea"></div>

        <div id="taskCard" class="task-card hidden">
            <h2>📜 Тапсырма</h2>
            <p class="task-text" id="taskText"></p>

            <button class="answer-button" id="answerButton"
                onclick="showAnswer()">
                🔓 Дұрыс жауапты көрсету
            </button>

            <div id="answerArea" class="hidden">
                <h2>✅ Дұрыс жауап</h2>
                <div class="answer-text" id="answerText"></div>
            </div>

            <button class="secondary" onclick="closeTask()">
                Жабу
            </button>
        </div>

        <div id="finishArea" class="task-card hidden">
            <h2>🏆 Ойын аяқталды!</h2>
            <p class="task-text">Барлық құпия сандық ашылды!</p>
            <button class="primary" onclick="backToSetup()">
                Жаңа ойын бастау
            </button>
        </div>

        <button class="secondary" onclick="backToSetup()">
            ⚙️ Баптауларға оралу
        </button>

    </section>
</div>

<script>
const countSelect = document.getElementById("chestCount");
const tasksContainer = document.getElementById("tasks");

function createTaskFields() {
    const count = Number(countSelect.value);
    tasksContainer.innerHTML = "<h3>📝 Тапсырмалар мен жауаптар</h3>";

    for (let i = 0; i < count; i++) {
        const taskLabel = document.createElement("label");
        taskLabel.textContent = `Сандық №${i + 1} — Тапсырма`;

        const taskInput = document.createElement("textarea");
        taskInput.placeholder = "Тапсырманы енгізіңіз...";
        taskInput.id = `task${i}`;

        const answerLabel = document.createElement("label");
        answerLabel.textContent = `Сандық №${i + 1} — Дұрыс жауап`;

        const answerInput = document.createElement("textarea");
        answerInput.placeholder = "Дұрыс жауапты енгізіңіз...";
        answerInput.id = `answer${i}`;

        tasksContainer.appendChild(taskLabel);
        tasksContainer.appendChild(taskInput);
        tasksContainer.appendChild(answerLabel);
        tasksContainer.appendChild(answerInput);
    }
}

countSelect.addEventListener("change", createTaskFields);
createTaskFields();

let tasks = [];
let answers = [];
let opened = 0;
let currentIndex = null;

function startGame() {
    const count = Number(countSelect.value);
    tasks = [];
    answers = [];

    for (let i = 0; i < count; i++) {
        const task = document.getElementById(`task${i}`).value.trim();
        const answer = document.getElementById(`answer${i}`).value.trim();

        if (!task || !answer) {
            alert(`${i + 1}-сандықтың тапсырмасы мен жауабын толтырыңыз!`);
            return;
        }

        tasks.push(task);
        answers.push(answer);
    }

    opened = 0;

    document.getElementById("setup").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");
    document.getElementById("taskCard").classList.add("hidden");
    document.getElementById("finishArea").classList.add("hidden");

    document.getElementById("openedCount").textContent = "0";
    document.getElementById("totalCount").textContent = count;

    const area = document.getElementById("chestArea");
    area.innerHTML = "";

    // Сандықтардың тапсырмаларын кездейсоқ орналастыру
    const order = Array.from({length: count}, (_, i) => i);

    for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
    }

    order.forEach((taskIndex, chestNumber) => {
        const button = document.createElement("button");
        button.className = "chest";

        const img = document.createElement("img");
        img.src = "images/сандық.png";
        img.alt = "Құпия сандық";

        const label = document.createElement("span");
        label.textContent = `Сандық ${chestNumber + 1}`;

        button.appendChild(img);
        button.appendChild(label);

        button.addEventListener("click", () => {
            openChest(button, taskIndex);
        });

        area.appendChild(button);
    });
}

function openChest(button, index) {
    if (button.disabled) return;

    button.disabled = true;
    button.style.opacity = "0.45";

    opened++;
    document.getElementById("openedCount").textContent = opened;

    currentIndex = index;

    document.getElementById("taskText").textContent = tasks[index];
    document.getElementById("answerText").textContent = answers[index];

    document.getElementById("answerArea").classList.add("hidden");
    document.getElementById("answerButton").classList.remove("hidden");
    document.getElementById("taskCard").classList.remove("hidden");

    if (opened === tasks.length) {
        document.getElementById("finishArea").classList.remove("hidden");
    }
}

function showAnswer() {
    document.getElementById("answerArea").classList.remove("hidden");
    document.getElementById("answerButton").classList.add("hidden");
}

function closeTask() {
    document.getElementById("taskCard").classList.add("hidden");
    currentIndex = null;
}

function backToSetup() {
    document.getElementById("game").classList.add("hidden");
    document.getElementById("setup").classList.remove("hidden");
}
</script>

</body>
</html>
