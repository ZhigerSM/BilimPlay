
<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BilimPlay — Сен түсіндің бе?</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #19264c;
  background: linear-gradient(135deg,#dce8ff,#f5e8d7);
}

header {
  max-width: 1200px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 27px;
  font-weight: 900;
  color: #263b75;
}

.logo span { color: #f4ae24; }

button { font-family: inherit; }

.fullscreen {
  background: #293e80;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  cursor: pointer;
}

.title {
  max-width: 750px;
  margin: 25px auto 35px;
  text-align: center;
  background: #fff5df;
  border: 4px solid #e6c99a;
  border-radius: 25px;
  padding: 20px;
  box-shadow: 0 6px 0 #d5b88d;
}

.title h1 {
  margin: 0;
  font-size: clamp(28px,5vw,48px);
}

.title p {
  margin: 10px 0 0;
  font-size: 20px;
}

.cards {
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 20px;
}

.card {
  border: 4px solid;
  border-radius: 28px;
  padding: 15px;
  text-align: center;
  cursor: pointer;
  transition: .2s;
  min-width: 0;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 20px #25345a35;
}

.card:active { transform: scale(.97); }

.green {
  background: #d9f9c8;
  border-color: #39a65a;
  color: #126332;
}

.yellow {
  background: #fff0b9;
  border-color: #efa92b;
  color: #a65a09;
}

.red {
  background: #ffd5d9;
  border-color: #e66b79;
  color: #a42637;
}

.character {
  width: 100%;
  max-width: 220px;
  height: 210px;
  display: block;
  margin: auto;
}

.card h2 {
  color: white;
  border-radius: 18px;
  padding: 15px 5px;
  font-size: clamp(19px,2.5vw,27px);
  margin: 5px 0 15px;
}

.green h2 { background: #187b43; }
.yellow h2 { background: #b96b12; }
.red h2 { background: #b52e3d; }

.stats {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  font-size: clamp(25px,4vw,40px);
  font-weight: bold;
  padding: 8px;
}

.stats .divider {
  width: 3px;
  height: 42px;
  background: currentColor;
  opacity: .35;
}

.bottom {
  max-width: 900px;
  margin: 30px auto;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.total {
  background: #fff5df;
  border: 3px solid #e6c99a;
  border-radius: 20px;
  padding: 18px 25px;
  font-size: 22px;
  font-weight: bold;
}

.total strong {
  font-size: 35px;
  margin-left: 10px;
}

.reset {
  background: #6343bb;
  color: white;
  border: none;
  border-radius: 17px;
  padding: 18px 25px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.reset:hover { background: #4c3298; }

.hint {
  text-align: center;
  color: #536184;
  margin-top: 20px;
}

@media(max-width:700px) {
  body { padding: 12px; }
  .cards { grid-template-columns: 1fr; }
  .character { height: 175px; }
  .title { margin: 20px auto; }
  .total { font-size: 18px; }
  .total strong { font-size: 28px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">🎓 Bilim<span>Play</span></div>
  <button class="fullscreen" onclick="toggleFullscreen()">
    ⛶ Толық экран
  </button>
</header>

<section class="title">
  <h1>Сен түсіндің бе?</h1>
  <p>Өз жауабыңды таңда!</p>
</section>

<main class="cards">

<!-- 1. ТҮСІНДІМ -->
<button class="card green" onclick="vote('understood')">

<img class="character" src="images/түсіндім.png" alt="Түсіндім">

<h2>Түсіндім</h2>

<div class="stats">
  <span id="count1">0</span>
  <span class="divider"></span>
  <span id="percent1">0%</span>
</div>
</button>

<!-- 2. СҰРАҒЫМ БАР -->
<button class="card yellow" onclick="vote('question')">

<img class="character" src="images/сұрағым бар.png" alt="Сұрағым бар">

<h2>Сұрағым бар</h2>

<div class="stats">
  <span id="count2">0</span>
  <span class="divider"></span>
  <span id="percent2">0%</span>
</div>
</button>

<!-- 3. ТҮСІНБЕДІМ -->
<button class="card red" onclick="vote('notUnderstood')">

<img class="character" src="images/түсінбедім.png" alt="Түсінбедім">

<h2>Түсінбедім</h2>

<div class="stats">
  <span id="count3">0</span>
  <span class="divider"></span>
  <span id="percent3">0%</span>
</div>
</button>

</main>

<section class="bottom">
  <div class="total">
    👥 Барлық жауап:
    <strong id="total">0</strong>
  </div>

  <button class="reset" onclick="resetResults()">
    ↻ Нәтижені тазалау
  </button>
</section>

<p class="hint">
  Әр оқушы өз жауабын таңдап, тиісті батырманы басады.
</p>

<script>
let results = {
  understood: 0,
  question: 0,
  notUnderstood: 0
};

function vote(type) {
  results[type]++;
  updateResults();
}

function updateResults() {
  const total =
    results.understood +
    results.question +
    results.notUnderstood;

  document.getElementById("total").textContent = total;

  const counts = [
    results.understood,
    results.question,
    results.notUnderstood
  ];

  const ids = [1, 2, 3];

  ids.forEach((id, index) => {
    const count = counts[index];
    const percent = total === 0
      ? 0
      : Math.round(count / total * 100);

    document.getElementById("count" + id).textContent = count;
    document.getElementById("percent" + id).textContent =
      percent + "%";
  });
}

function resetResults() {
  if (confirm("Барлық нәтижені тазалаймыз ба?")) {
    results = {
      understood: 0,
      question: 0,
      notUnderstood: 0
    };
    updateResults();
  }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}

updateResults();
</script>

</body>
</html>
